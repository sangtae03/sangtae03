<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#090d20" />
<title>ROBO//GRIP · SANGTAE03 Arcade</title>
<style>
:root{color-scheme:dark;--ink:#050b1c;--cyan:#23e5f0;--mag:#f46ad0;--muted:#a2bad5;--panel:#0d1931}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#172c51 0%,#080e23 52%,#050819 100%);font:16px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d3f8ff;min-height:100vh}header{max-width:1100px;margin:0 auto;padding:22px 22px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}h1{font-size:clamp(24px,4.4vw,44px);margin:0;letter-spacing:2px;text-shadow:0 0 19px #11cfe080}h1 span{color:var(--mag)}p{margin:0;color:var(--muted)}main{max-width:1100px;padding:4px 22px 24px;margin:auto}.shell{border:1px solid #285b78;background:#08132ae8;border-radius:16px;box-shadow:0 0 40px #00e1f01b;overflow:hidden}.hud{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #214664}.hud>div{padding:11px 14px;border-right:1px solid #214664}.hud>div:last-child{border:0}.label{color:#7da9bd;font-size:12px;text-transform:uppercase}.number{font-size:24px;font-weight:800;color:var(--cyan)}.number.mag{color:var(--mag)}canvas{width:100%;display:block;aspect-ratio:16/9;background:#07152b;touch-action:none}.bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-top:1px solid #214664}button{background:#0e2746;color:#ddfbff;border:1px solid #27b5d7;padding:10px 14px;border-radius:9px;font:inherit;cursor:pointer}button:hover,button:focus{background:#16486c;box-shadow:0 0 10px #27b5d766}button.action{border-color:var(--mag);color:#ffd4f5}.controls{display:grid;grid-template-columns:repeat(3,54px);gap:5px;place-items:center}.controls button{width:54px;height:46px;padding:0}.info{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.status{font-size:13px;color:#9abbd4;max-width:470px}.dot{width:8px;height:8px;background:#00e6c2;border-radius:50%;display:inline-block;box-shadow:0 0 10px #00e6c2}footer{padding:22px;text-align:center;color:#648ba3;font-size:12px}@media (max-width:600px){header{padding:18px 14px}main{padding:5px 12px} .hud>div{padding:8px 10px}.number{font-size:19px}.bottom{justify-content:center}.controls{order:3}.status{text-align:center}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div><h1>ROBO<span>//</span>GRIP</h1><p>CYBER PICK & PLACE SIMULATION · SYSTEM 03</p></div><a href="https://github.com/sangtae03">↖ GITHUB PROFILE</a></header>
<main><div class="shell">
<div class="hud"><div><div class="label">Delivered</div><div class="number" id="score">00</div></div><div><div class="label">Time remaining</div><div class="number mag" id="time">60s</div></div><div><div class="label">Best score</div><div class="number" id="best">00</div></div></div>
<canvas id="game" width="960" height="540" aria-label="Pick-and-place game, move the robot with WASD or arrow keys, use space to pick or drop"></canvas>
<div class="bottom"><div class="info"><button id="restart" class="action">↻ RESTART</button><div class="status"><span class="dot"></span> <span id="status" role="status" aria-live="polite">Move to the red cube. SPACE to pick.</span></div></div><div class="controls" aria-label="Touch controls"><span></span><button data-key="ArrowUp" aria-label="Up">▲</button><span></span><button data-key="ArrowLeft" aria-label="Left">◀</button><button data-key="Space" aria-label="Pick or drop">◉</button><button data-key="ArrowRight" aria-label="Right">▶</button><span></span><button data-key="ArrowDown" aria-label="Down">▼</button><span></span></div></div>
</div><footer>MOVE: WASD / ARROWS · PICK / DROP: SPACE · DELIVER TO THE GREEN TARGET · 60 SECOND CHALLENGE<br>© SANGTAE03 · BUILT FOR FUN, NOT REAL ROBOT CONTROL</footer></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');
const W=c.width,H=c.height,keys=new Set(),BASE={x:125,y:475},target={x:780,y:220};let pos={x:380,y:350},cube={x:350,y:355},holding=false,score=0,remaining=60,finished=false,started=false,last=performance.now(),now=0,flash=0;
let best=0;try{best=Math.max(0,Number(localStorage.getItem('robo-grip-best')||0))}catch(e){}bestEl.textContent=String(best).padStart(2,'0');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function message(t){statusEl.textContent=t}function reset(){pos={x:380,y:350};cube={x:350,y:355};holding=false;score=0;remaining=60;finished=false;started=false;flash=0;keys.clear();updateHUD();message('Move to the red cube. SPACE to pick.')}function updateHUD(){scoreEl.textContent=String(score).padStart(2,'0');timeEl.textContent=Math.ceil(Math.max(0,remaining))+'s';bestEl.textContent=String(best).padStart(2,'0')}
function spawn(){const x=245+Math.random()*240,y=185+Math.random()*250;cube={x,y};target.x=650+Math.random()*200;target.y=120+Math.random()*300}
function grab(){if(finished)return;started=true;if(holding){if(distance(pos,target)<67){score++;if(score>best){best=score;try{localStorage.setItem('robo-grip-best',String(best))}catch(e){}}holding=false;spawn();flash=24;message('DELIVERY SUCCESSFUL! NEXT TARGET INBOUND.')}else{holding=false;cube={x:pos.x,y:pos.y};message('CUBE RELEASED. BRING IT TO THE GREEN ZONE.')}}else if(distance(pos,cube)<50){holding=true;message('CARGO ACQUIRED. GO TO THE GREEN TARGET.')}else message('TOO FAR FROM CUBE! MOVE CLOSER.');updateHUD()}
function keyName(k){if(k===' '||k==='Spacebar'||k==='Space')return 'Space';return k.length===1?k.toLowerCase():k}
window.addEventListener('keydown',e=>{const k=keyName(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if(k==='Space'&&!e.repeat){grab();return;}keys.add(k);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k))started=true});window.addEventListener('keyup',e=>keys.delete(keyName(e.key)));window.addEventListener('blur',()=>keys.clear());document.getElementById('restart').addEventListener('click',reset);
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='Space')grab();else{keys.add(k);started=true}b.setPointerCapture(e.pointerId)});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>keys.delete(k))}
function line(a,b,thick,color,glow){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=thick;ctx.strokeStyle=color;ctx.lineCap='round';ctx.shadowColor=glow||color;ctx.shadowBlur=16;ctx.stroke();ctx.shadowBlur=0}
function joint(p,r){ctx.beginPath();ctx.arc(p.x,p.y,r,0,2*Math.PI);ctx.fillStyle='#173553';ctx.fill();ctx.strokeStyle='#22e5ef';ctx.lineWidth=4;ctx.shadowColor='#22ddeb';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(p.x,p.y,r*.32,0,2*Math.PI);ctx.fillStyle='#f266d0';ctx.fill()}
function robot(){const shoulder={x:172,y:398},dx=pos.x-shoulder.x,dy=pos.y-shoulder.y;const len=Math.hypot(dx,dy),bend=clamp(65+len*.13,80,145);let mid={x:(shoulder.x+pos.x)/2 -dy/Math.max(len,1)*bend,y:(shoulder.y+pos.y)/2 +dx/Math.max(len,1)*bend};line(BASE,shoulder,33,'#234060','#23e5f0');line(shoulder,mid,27,'#3b5a7e','#24d3ef');line(mid,pos,23,'#48678b','#24d3ef');line(shoulder,mid,2,'#e657c1');line(mid,pos,2,'#e657c1');joint(BASE,28);joint(shoulder,21);joint(mid,18);joint(pos,14);line({x:pos.x-13,y:pos.y+13},{x:pos.x-16,y:pos.y+32},6,'#d1f9ff');line({x:pos.x+13,y:pos.y+13},{x:pos.x+16,y:pos.y+32},6,'#d1f9ff')}
function drawCube(x,y,glow=false){ctx.save();ctx.shadowColor='#ff3478';ctx.shadowBlur=glow?29:16;ctx.fillStyle='#ff417c';ctx.fillRect(x-17,y-17,34,34);ctx.shadowBlur=0;ctx.strokeStyle='#ffd4e5';ctx.strokeRect(x-17,y-17,34,34);ctx.fillStyle='#ffbad3';ctx.fillRect(x-10,y-10,8,8);ctx.restore()}
function render(t){const dt=Math.min(.06,(t-last)/1000);last=t;now=t;if(!finished){const speed=holding?195:230;let dx=0,dy=0;if(keys.has('a')||keys.has('ArrowLeft'))dx--;if(keys.has('d')||keys.has('ArrowRight'))dx++;if(keys.has('w')||keys.has('ArrowUp'))dy--;if(keys.has('s')||keys.has('ArrowDown'))dy++;const mag=Math.hypot(dx,dy)||1;pos.x=clamp(pos.x+dx/mag*speed*dt,225,910);pos.y=clamp(pos.y+dy/mag*speed*dt,65,483);if(started){remaining-=dt;if(remaining<=0){remaining=0;finished=true;message('MISSION COMPLETE · SCORE '+score+' · RESTART TO TRY AGAIN')}}}if(holding){cube.x=pos.x;cube.y=pos.y+45}if(flash>0)flash--;
ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#08132c');g.addColorStop(1,'#111432');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#122e45';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.strokeStyle='#246b77';ctx.lineWidth=3;ctx.strokeRect(12,12,W-24,H-24);
ctx.beginPath();ctx.arc(target.x,target.y,55+Math.sin(now/300)*4,0,Math.PI*2);ctx.fillStyle='rgba(15,233,169,.07)';ctx.fill();ctx.shadowColor='#18ffbb';ctx.shadowBlur=18;ctx.strokeStyle='#26eeb9';ctx.lineWidth=4;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#6dffdb';ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillText('DROP ZONE',target.x,target.y+6);
ctx.fillStyle='#7fa9bd';ctx.font='14px monospace';ctx.textAlign='left';ctx.fillText('SO-101 // ARM TELEOP',36,43);ctx.fillStyle='#e56bd0';ctx.fillText('VISION FEED • '+Math.floor(t/100)%10000,36,65);
robot();if(!holding)drawCube(cube.x,cube.y);else drawCube(cube.x,cube.y,true);
if(flash>0){ctx.fillStyle='rgba(25,247,195,'+(flash/150)+')';ctx.fillRect(0,0,W,H)}if(finished){ctx.fillStyle='rgba(4,8,25,.77)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#37edee';ctx.font='bold 55px monospace';ctx.textAlign='center';ctx.fillText('MISSION COMPLETE',W/2,H/2-12);ctx.fillStyle='#e978d7';ctx.font='26px monospace';ctx.fillText('SCORE '+score+'  •  PRESS RESTART',W/2,H/2+38)}updateHUD();requestAnimationFrame(render)}
reset();requestAnimationFrame(t=>{last=t;render(t)});
})();
</script>
</body>
</html>
